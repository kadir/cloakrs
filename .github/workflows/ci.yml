name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

jobs:
  dependency-audit:
    uses: ./.github/workflows/audit.yml

  installer:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test release installation contract offline
        run: python3 -m unittest discover -s tests/installer -v

  test:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.75.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Test evaluation scoring
        run: python -m unittest discover -s tests/evaluation -v

      - name: Build evaluation adapter
        run: cargo build --locked -p cloakrs-cli --example evaluate

      - name: Check labeled detection baseline
        run: python tests/evaluation/run.py --binary target/debug/examples/evaluate${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Build documentation
        run: cargo doc --workspace --locked --no-deps

  benchmarks:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmark
        run: cargo bench --locked -p cloakrs-cli --bench scan_benchmark --no-run

      - name: Run short benchmark smoke
        run: cargo bench --locked -p cloakrs-cli --bench scan_benchmark -- --test
