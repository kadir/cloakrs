name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
            binary_name: cloakrs
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: linux-aarch64
            binary_name: cloakrs
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: macos-x86_64
            binary_name: cloakrs
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-aarch64
            binary_name: cloakrs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-x86_64
            binary_name: cloakrs.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release -p cloakrs-cli --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "cloakrs-${{ matrix.asset_name }}.zip" "${{ matrix.binary_name }}"
            powershell -Command "Get-FileHash cloakrs-${{ matrix.asset_name }}.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  cloakrs-${{ matrix.asset_name }}.zip' }" > "cloakrs-${{ matrix.asset_name }}.sha256"
          else
            tar -czf "cloakrs-${{ matrix.asset_name }}.tar.gz" "${{ matrix.binary_name }}"
            shasum -a 256 "cloakrs-${{ matrix.asset_name }}.tar.gz" > "cloakrs-${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloakrs-${{ matrix.asset_name }}
          path: dist/cloakrs-${{ matrix.asset_name }}.*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

