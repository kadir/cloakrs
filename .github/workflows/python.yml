name: Python bindings

on:
  workflow_call:
  push:
    branches: [master, main, feature/python-bindings]
    paths:
      - 'bindings/python/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/evaluation/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'bindings/python/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/evaluation/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        rust: [stable]
        include:
          - os: ubuntu-latest
            python: '3.12'
            rust: stable
          - os: ubuntu-latest
            python: '3.13'
            rust: stable
          - os: ubuntu-latest
            python: '3.11'
            rust: '1.83.0'
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
      - name: Install build and test tools
        run: python -m pip install 'maturin>=1.15,<2' 'pytest>=8,<10' 'mypy>=1.15,<3'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust binding
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build wheel
        run: maturin build --release --locked --out dist
      - name: Install the built wheel without resolving dependencies
        run: python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', wheels[0]])"
      - name: Build Rust CLI for mapping interoperability tests
        run: cargo build --manifest-path ../../Cargo.toml --locked -p cloakrs-cli
      - name: Test installed wheel and Rust detection parity
        run: python -m pytest tests
      - name: Check public types and binding stubs
        run: python -m mypy python/cloakrs tests/typing_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python }}-rust-${{ matrix.rust }}-${{ matrix.os }}
          path: bindings/python/dist/*.whl
