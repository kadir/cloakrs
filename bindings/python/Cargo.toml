[package]
name = "cloakrs-python"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cloakrs-core = { path = "../../crates/cloakrs-core", version = "0.4.0" }
cloakrs-locales = { path = "../../crates/cloakrs-locales", version = "0.4.0" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
serde_json = "1"
