[package]
name = "cloakrs-python"
description = "Python bindings for local cloakrs PII detection and sanitization"
repository = "https://github.com/kadir/cloakrs"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cloakrs-core = { path = "../../crates/cloakrs-core", version = "0.4.1" }
cloakrs-locales = { path = "../../crates/cloakrs-locales", version = "0.4.1" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
serde_json = "1"
