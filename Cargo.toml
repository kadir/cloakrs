[workspace]
members = [
    "crates/cloakrs-core",
    "crates/cloakrs-patterns",
    "crates/cloakrs-locales",
    "crates/cloakrs-adapters",
    "crates/cloakrs-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "MIT"
repository = "https://github.com/kadir/cloakrs"
homepage = "https://github.com/kadir/cloakrs"
documentation = "https://docs.rs/cloakrs-core"
readme = "README.md"
keywords = ["pii", "redaction", "privacy", "masking", "cli"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
csv = "1"
indicatif = "0.17"
ignore = "0.4"
once_cell = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
